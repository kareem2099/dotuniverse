<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>
    
    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#005b9f" />
    </linearGradient>

    <!-- Glowing Green Gradient -->
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" />
      <stop offset="100%" stop-color="#1b8a07" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Hexagonal Tech Outlines (Scaled 0.85 for PWA Maskable Safe Zone) -->
  <polygon points="256,81 404,166 404,346 256,431 108,346 108,166" fill="none" stroke="#1f2d3d" stroke-width="6" />
  <polygon points="256,98 387,174 387,338 256,414 125,338 125,174" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.4" />

  <!-- Dotted Orbit Ring -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1f2d3d" stroke-width="4" stroke-dasharray="10 12" />

  <!-- Glowing Outer Hexagon Dots -->
  <circle cx="256" cy="81" r="8" fill="#39ff14" filter="url(#glow)" />
  <circle cx="404" cy="166" r="8" fill="#00f5ff" filter="url(#glow)" />
  <circle cx="404" cy="346" r="8" fill="#00f5ff" filter="url(#glow)" />
  <circle cx="256" cy="431" r="8" fill="#39ff14" filter="url(#glow)" />
  <circle cx="108" cy="346" r="8" fill="#00f5ff" filter="url(#glow)" />
  <circle cx="108" cy="166" r="8" fill="#00f5ff" filter="url(#glow)" />

  <!-- Central Glowing Structure -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="url(#cyanGlow)" stroke-width="6" filter="url(#glow)" />
  
  <!-- Outer Dotted Spinner Core -->
  <circle cx="256" cy="256" r="47" fill="none" stroke="url(#greenGlow)" stroke-width="3" stroke-dasharray="6 8" />

  <!-- Center Target Dot (dotUniverse) -->
  <circle cx="256" cy="256" r="20" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="7" fill="#ffffff" />
</svg>
