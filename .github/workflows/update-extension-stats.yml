name: Auto Update Extension Stats

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync extension downloads and versions
        run: node scripts/sync-extension-stats.mjs

      # Runs even if the stats sync failed; each script only writes after a complete fetch
      - name: Sync blog from dev.to
        if: ${{ !cancelled() }}
        run: node scripts/sync-blog.mjs

      - name: Commit and push changes if updated
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html README.md blog
          if git diff --staged --quiet; then
            echo "No changes in extension stats or blog detected."
          else
            git commit -m "chore: auto-update extension stats and blog [skip ci]"
            git push
          fi
